<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Konnex</title>
  <defs>
    <!-- azul profundo à esquerda -> ciano luminoso à direita, como na marca -->
    <linearGradient id="kx" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%"   stop-color="#1d4ed8"/>
      <stop offset="45%"  stop-color="#3b82f6"/>
      <stop offset="70%"  stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <linearGradient id="kxChevronL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1e3fd8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="kxChevronR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- núcleo brilhante do centro -->
    <radialGradient id="kxCore">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="35%"  stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>

    <!-- brilho: dá o volume sem precisar de fundo -->
    

    
  </defs>

  <!-- halo do núcleo -->
  <circle cx="256" cy="256" r="54" fill="#22d3ee" opacity="0.35"/>

  <g>
    <!-- eixos do X, das pontas ao núcleo -->
    <g stroke="url(#kx)" stroke-width="19" stroke-linecap="round" fill="none">
      <path d="M 138 122 L 256 256"/>
      <path d="M 374 122 L 256 256"/>
      <path d="M 138 390 L 256 256"/>
      <path d="M 374 390 L 256 256"/>
    </g>

    <!-- chevrons que fecham o K -->
    <path d="M 168 168 L 254 256 L 168 344"
          fill="none" stroke="url(#kxChevronL)" stroke-width="40"
          stroke-linejoin="miter" stroke-linecap="butt"/>
    <path d="M 344 168 L 258 256 L 344 344"
          fill="none" stroke="url(#kxChevronR)" stroke-width="40"
          stroke-linejoin="miter" stroke-linecap="butt"/>

    <!-- nós das extremidades -->
    <g fill="#0b1220" stroke="url(#kx)" stroke-width="15">
      <circle cx="138" cy="122" r="19"/>
      <circle cx="374" cy="122" r="19"/>
      <circle cx="138" cy="390" r="19"/>
      <circle cx="374" cy="390" r="19"/>
    </g>

    <!-- núcleo central -->
    <circle cx="256" cy="256" r="30" fill="url(#kxCore)"/>
    <circle cx="256" cy="256" r="13" fill="#0b1220" opacity="0.85"/>
  </g>
</svg>
